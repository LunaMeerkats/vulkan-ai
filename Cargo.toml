[package]
name = "vulkan-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Research tooling for training neural networks through Vulkan"
license = "Apache-2.0"
repository = "https://github.com/LunaMeerkats/vulkan-ai"
readme = "README.md"
publish = false

[features]
default = ["cpu"]
cpu = ["burn/flex"]
vulkan = ["burn/vulkan", "dep:burn-cubecl", "dep:cubecl", "dep:futures-lite"]
vulkan-fusion = ["vulkan", "burn/fusion", "dep:burn-fusion", "dep:burn-ir"]

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["autodiff", "std"] }
burn-cubecl = { version = "0.21.0", default-features = false, features = ["std"], optional = true }
burn-fusion = { version = "0.21.0", optional = true }
burn-ir = { version = "0.21.0", optional = true }
cubecl = { version = "0.10.0", default-features = false, optional = true }
futures-lite = { version = "2.6.1", optional = true }

[[bin]]
name = "vulkan-ai-probe"
path = "src/bin/vulkan-ai-probe.rs"
required-features = ["cpu", "vulkan"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
